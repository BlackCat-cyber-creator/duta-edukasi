<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" width="340" height="250" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0F172A"/>
    </marker>
  </defs>
  <rect width="340" height="250" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Square ABCD: A(70,50), B(230,50), C(230,210), D(70,210) -->
  <rect x="70" y="50" width="160" height="160" fill="#FEF3C7" fill-opacity="0.55" stroke="#475569" stroke-width="2"/>
  <!-- Diagonal AC -->
  <line x1="70" y1="50" x2="230" y2="210" stroke="#475569" stroke-width="1.8"/>
  <!-- Line through F(137.2, 117.2) and E(230, 78.76) extending to (38, 158.3) and G(296, 51.4) -->
  <line x1="38" y1="158.3" x2="296" y2="51.4" stroke="#0F172A" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <!-- Points -->
  <circle cx="70" cy="50" r="3" fill="#2563EB"/>
  <circle cx="230" cy="50" r="3" fill="#2563EB"/>
  <circle cx="230" cy="210" r="3" fill="#2563EB"/>
  <circle cx="70" cy="210" r="3" fill="#2563EB"/>
  <circle cx="137.2" cy="117.2" r="3.2" fill="#2563EB"/>
  <circle cx="230" cy="78.8" r="3.2" fill="#2563EB"/>
  <circle cx="280" cy="58.1" r="3.2" fill="#2563EB"/>
  <!-- Labels -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A">
    <text x="64" y="42" text-anchor="end">A</text>
    <text x="234" y="42" text-anchor="start">B</text>
    <text x="235" y="226" text-anchor="start">C</text>
    <text x="64" y="226" text-anchor="end">D</text>
    <text x="137" y="136" text-anchor="middle">F</text>
    <text x="237" y="92" text-anchor="start">E</text>
    <text x="278" y="46" text-anchor="middle">G</text>
  </g>
</svg>
