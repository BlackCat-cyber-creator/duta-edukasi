<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300" role="img">
  <defs>
    <g id="heart">
      <path d="M0,11 C-11,3 -14,-5 -10,-10 C-6,-14 0,-10 0,-6 C0,-10 6,-14 10,-10 C14,-5 11,3 0,11 Z" fill="#F9A8D4" stroke="#1E293B" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g id="diamond">
      <polygon points="0,-13 12,0 0,13 -12,0" fill="#FDE047" stroke="#1E293B" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
    <g id="star">
      <polygon points="0,-13 3.6,-4.2 13,-4.2 5.4,1.6 8.2,10.8 0,5.2 -8.2,10.8 -5.4,1.6 -13,-4.2 -3.6,-4.2" fill="#EF4444" stroke="#1E293B" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g id="ring">
      <circle cx="0" cy="0" r="11" fill="#16A34A" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#F8FAFC" stroke="#1E293B" stroke-width="1.4"/>
    </g>
  </defs>
  <rect width="320" height="300" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Outer frame for 4x4 grid + totals -->
  <rect x="24" y="20" width="272" height="260" rx="6" fill="#FCE7F3" fill-opacity="0.35" stroke="#CBD5E1" stroke-width="1"/>
  <!-- 4x4 symbol cells -->
  <rect x="30" y="26" width="208" height="208" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
  <line x1="82" y1="26" x2="82" y2="234" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="134" y1="26" x2="134" y2="234" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="186" y1="26" x2="186" y2="234" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="30" y1="78" x2="238" y2="78" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="30" y1="130" x2="238" y2="130" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="30" y1="182" x2="238" y2="182" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Row 1: heart, diamond, heart, diamond -->
  <use href="#heart" x="56" y="52"/>
  <use href="#diamond" x="108" y="52"/>
  <use href="#heart" x="160" y="52"/>
  <use href="#diamond" x="212" y="52"/>

  <!-- Row 2: star, star, ring, star -->
  <use href="#star" x="56" y="104"/>
  <use href="#star" x="108" y="104"/>
  <use href="#ring" x="160" y="104"/>
  <use href="#star" x="212" y="104"/>

  <!-- Row 3: star, star, heart, star -->
  <use href="#star" x="56" y="156"/>
  <use href="#star" x="108" y="156"/>
  <use href="#heart" x="160" y="156"/>
  <use href="#star" x="212" y="156"/>

  <!-- Row 4: ring, heart, heart, ring -->
  <use href="#ring" x="56" y="208"/>
  <use href="#heart" x="108" y="208"/>
  <use href="#heart" x="160" y="208"/>
  <use href="#ring" x="212" y="208"/>

  <!-- Row sums -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">
    <text x="266" y="59">24</text>
    <text x="266" y="111">26</text>
    <text x="266" y="163">23</text>
    <text x="266" y="215">26</text>
    <!-- Column sums -->
    <text x="56" y="264" fill="#B91C1C">?</text>
    <text x="108" y="264">24</text>
    <text x="160" y="264">23</text>
    <text x="212" y="264">27</text>
  </g>
</svg>
