<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#1e293b" stroke-width="2.4" />
    </pattern>
  </defs>
  <rect width="240" height="240" fill="#ffffff" />
  <circle cx="120" cy="120" r="96" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" />
  <!-- Top semicircle (diameter from (120,24) to (120,120), bulging left) -->
  <path d="M 120 120 L 120 24 A 48 48 0 0 0 120 120 Z" fill="url(#hatch)" stroke="#1e293b" stroke-width="2" />
  <!-- Right semicircle (diameter from (120,120) to (216,120), bulging up) -->
  <path d="M 120 120 L 216 120 A 48 48 0 0 0 120 120 Z" fill="url(#hatch)" stroke="#1e293b" stroke-width="2" />
  <!-- Bottom semicircle (diameter from (120,120) to (120,216), bulging right) -->
  <path d="M 120 120 L 120 216 A 48 48 0 0 0 120 120 Z" fill="url(#hatch)" stroke="#1e293b" stroke-width="2" />
  <!-- Left semicircle (diameter from (24,120) to (120,120), bulging down) -->
  <path d="M 120 120 L 24 120 A 48 48 0 0 0 120 120 Z" fill="url(#hatch)" stroke="#1e293b" stroke-width="2" />
</svg>
