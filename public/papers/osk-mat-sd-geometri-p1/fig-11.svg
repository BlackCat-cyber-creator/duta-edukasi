  <circle cx="192.2" cy="49.6" r="3.5" fill="#DC2626" stroke="#0F172A" stroke-width="1"/>
  <!-- Labels -->
  <text x="33" y="165" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">A</text>
  <text x="287" y="165" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">B</text>
