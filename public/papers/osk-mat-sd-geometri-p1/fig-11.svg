  <polyline points="45,160 192.2,49.6 275,160" fill="none" stroke="#1E3A8A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Points A, B, C, D, Q, P -->
  <circle cx="45" cy="160" r="3.5" fill="#DC2626" stroke="#0F172A" stroke-width="1"/>
