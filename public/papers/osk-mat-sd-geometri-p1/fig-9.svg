<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210" role="img">
  <defs>
    <mask id="cutCircle9">
      <rect width="320" height="210" fill="#FFFFFF"/>
      <circle cx="208" cy="106" r="64" fill="#000000"/>
    </mask>
  </defs>
  <rect width="320" height="210" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Shaded trapezoid minus circle centered at (208,106) -->
  <polygon points="48,42 176,42 240,170 48,170" fill="#CBD5E1" mask="url(#cutCircle9)"/>
  <!-- Trapezoid outline -->
  <polygon points="48,42 176,42 240,170 48,170" fill="none" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Circle outline (radius 64 = 2 cm) -->
  <circle cx="208" cy="106" r="64" fill="none" stroke="#0F172A" stroke-width="1.8"/>
  <!-- Dashed diameter along slanted edge from (208 - 64/sqrt(5), 106 - 128/sqrt(5)) to (208 + 64/sqrt(5), 106 + 128/sqrt(5)) -->
  <line x1="179.38" y1="48.76" x2="236.62" y2="163.24" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 3"/>
  <!-- Center dot -->
  <circle cx="208" cy="106" r="3" fill="#0F172A"/>
  <!-- Dimension labels -->
  <text x="112" y="30" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">4 cm</text>
  <text x="38" y="110" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">4 cm</text>
  <text x="144" y="192" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">6 cm</text>
  <text x="206" y="76" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">2 cm</text>
  <text x="233" y="138" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">2 cm</text>
</svg>
