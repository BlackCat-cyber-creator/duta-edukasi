<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img">
  <rect width="320" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Shaded region: outer kite ABCD minus inner kite AFCE -->
  <path d="M 50 110 L 115 28 L 270 110 L 115 192 Z M 50 110 L 115 62 L 270 110 L 115 158 Z" fill="#94A3B8" fill-rule="evenodd"/>
  <!-- Outer kite ABCD -->
  <polygon points="50,110 115,28 270,110 115,192" fill="none" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner kite AFCE -->
  <polygon points="50,110 115,62 270,110 115,158" fill="none" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Symmetry axis AC and diagonal BD -->
  <line x1="50" y1="110" x2="270" y2="110" stroke="#334155" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="115" y1="28" x2="115" y2="192" stroke="#334155" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- Right angle mark at intersection -->
  <polyline points="115,99 126,99 126,110" fill="none" stroke="#334155" stroke-width="1.2"/>
  <!-- Vertex labels -->
  <text x="36" y="115" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">A</text>
  <text x="115" y="210" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">B</text>
  <text x="284" y="115" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">C</text>
  <text x="115" y="20" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">D</text>
  <text x="128" y="60" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">E</text>
  <text x="128" y="170" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">F</text>
</svg>
