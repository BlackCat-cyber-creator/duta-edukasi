<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img">
  <rect width="320" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Large square ABCD (side 120: 4 cm) -->
  <rect x="45" y="45" width="120" height="120" fill="none" stroke="#0F172A" stroke-width="1.8"/>
  <!-- Small square CEFH (side 90: 3 cm) -->
  <rect x="165" y="75" width="90" height="90" fill="none" stroke="#0F172A" stroke-width="1.8"/>
  <!-- Shaded triangle ACF -->
  <polygon points="45,45 165,165 255,75" fill="#0F172A" fill-opacity="0.85" stroke="#0F172A" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Point G on CD where AF crosses CD (165, 62.14) -->
  <circle cx="165" cy="62.14" r="2.8" fill="#0F172A"/>
  <!-- Vertex labels -->
  <text x="34" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#0F172A">A</text>
  <text x="45" y="183" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#0F172A">B</text>
  <text x="165" y="183" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#0F172A">C</text>
  <text x="165" y="37" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#0F172A">D</text>
  <text x="255" y="183" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#0F172A">E</text>
  <text x="266" y="72" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#0F172A">F</text>
  <text x="174" y="57" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic" font-weight="700" fill="#0F172A">G</text>
</svg>
