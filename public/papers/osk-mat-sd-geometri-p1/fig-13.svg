<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220" role="img">
  <rect width="240" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Hidden back edges from back-bottom-left (90,137) -->
  <g stroke="#64748B" stroke-width="1.4" stroke-dasharray="4 3">
    <line x1="90" y1="137" x2="90" y2="47"/>
    <line x1="90" y1="137" x2="180" y2="137"/>
    <line x1="90" y1="137" x2="55" y2="165"/>
  </g>
  <!-- Visible edges -->
  <g stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round" fill="none">
    <!-- Front face -->
    <rect x="55" y="75" width="90" height="90"/>
    <!-- Top and right visible back edges -->
    <polyline points="55,75 90,47 180,47 180,137 145,165"/>
    <line x1="145" y1="75" x2="180" y2="47"/>
  </g>
  <!-- Space diagonal AB: B=(90,47), A=(145,165) -->
  <line x1="90" y1="47" x2="145" y2="165" stroke="#1E3A8A" stroke-width="2.4"/>
  <!-- Labels -->
  <text x="84" y="39" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">B</text>
  <text x="150" y="182" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">A</text>
</svg>
