<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img">
  <defs>
    <pattern id="brick12" width="12" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <rect width="12" height="10" fill="#E2E8F0"/>
      <path d="M 0 5 L 12 5 M 6 0 L 6 5 M 0 5 L 0 10 M 12 5 L 12 10" fill="none" stroke="#64748B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="240" height="240" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Outer annulus sector RPQ (from -110 deg to +10 deg, 120 deg): R_out=88, R_in=44 -->
  <!-- -110 deg: cos=-0.3420, sin=-0.9397 -> outer(89.90, 37.31), inner(104.95, 78.65) -->
  <!-- +10 deg: cos=0.9848, sin=0.1736 -> outer(206.66, 135.28), inner(163.33, 127.64) -->
  <path d="M 89.90 37.31 A 88 88 0 0 1 206.66 135.28 L 163.33 127.64 A 44 44 0 0 0 104.95 78.65 Z" fill="url(#brick12)"/>
  <!-- Inner circle reflex sector (240 deg: from +10 deg clockwise to -110 deg) -->
  <path d="M 120 120 L 163.33 127.64 A 44 44 0 1 1 104.95 78.65 Z" fill="url(#brick12)"/>
  <!-- Concentric circles -->
  <circle cx="120" cy="120" r="88" fill="none" stroke="#0F172A" stroke-width="2"/>
  <circle cx="120" cy="120" r="44" fill="none" stroke="#0F172A" stroke-width="2"/>
  <!-- Radii PR and PQ -->
  <line x1="120" y1="120" x2="89.90" y2="37.31" stroke="#0F172A" stroke-width="2"/>
  <line x1="120" y1="120" x2="206.66" y2="135.28" stroke="#0F172A" stroke-width="2"/>
  <!-- Labels -->
  <text x="108" y="132" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">P</text>
  <text x="84" y="27" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">R</text>
  <text x="219" y="142" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Q</text>
</svg>
