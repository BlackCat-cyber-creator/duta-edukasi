<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440">
  <rect width="760" height="440" fill="#ffffff"/>
  <!-- Net of Donation Box -->
  <g transform="translate(210, 18)">
    <!-- Top face with slot -->
    <rect x="64" y="0" width="112" height="64" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <rect x="92" y="25" width="56" height="12" fill="#f5ebe6" stroke="#b45309" stroke-width="1.2"/>
    <!-- Left yellow face -->
    <rect x="0" y="64" width="64" height="72" fill="#ffff00" stroke="#374151" stroke-width="1.5"/>
    <!-- Center face: Kotak Donasi -->
    <rect x="64" y="64" width="112" height="72" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="120" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">Kotak Donasi</text>
    <!-- Right grey face -->
    <rect x="176" y="64" width="64" height="72" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
    <!-- Far right white face -->
    <rect x="240" y="64" width="112" height="72" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <!-- Bottom white face -->
    <rect x="64" y="136" width="112" height="64" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Separator line -->
  <line x1="20" y1="232" x2="740" y2="232" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Option A: Front Kotak Donasi upright, Top blank, Right yellow -->
  <g transform="translate(30, 250)">
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827">A.</text>
    <g transform="translate(28, 12)">
      <polygon points="0,24 32,0 132,0 100,24" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
      <polygon points="100,24 132,0 132,64 100,88" fill="#ffff00" stroke="#374151" stroke-width="1.4"/>
      <rect x="0" y="24" width="100" height="64" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
      <text x="50" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827">Kotak Donasi</text>
    </g>
  </g>

  <!-- Option B: Front Kotak Donasi upside-down, Top slot, Right grey -->
  <g transform="translate(210, 250)">
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827">B.</text>
    <g transform="translate(28, 12)">
      <polygon points="0,24 32,0 132,0 100,24" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
      <polygon points="41,15 51,7 93,7 83,15" fill="#f5ebe6" stroke="#b45309" stroke-width="1.1"/>
      <polygon points="100,24 132,0 132,64 100,88" fill="#6b7280" stroke="#374151" stroke-width="1.4"/>
      <rect x="0" y="24" width="100" height="64" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
      <text x="50" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827" transform="rotate(180 50 53)">Kotak Donasi</text>
    </g>
  </g>

  <!-- Option C: Front white, Top slot, Right yellow -->
  <g transform="translate(390, 250)">
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827">C.</text>
    <g transform="translate(28, 12)">
      <polygon points="0,24 32,0 132,0 100,24" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
      <polygon points="41,15 51,7 93,7 83,15" fill="#f5ebe6" stroke="#b45309" stroke-width="1.1"/>
      <polygon points="100,24 132,0 132,64 100,88" fill="#ffff00" stroke="#374151" stroke-width="1.4"/>
      <rect x="0" y="24" width="100" height="64" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
    </g>
  </g>

  <!-- Option D: Front Kotak Donasi upright, Top slot, Right grey -->
  <g transform="translate(570, 250)">
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827">D.</text>
    <g transform="translate(28, 12)">
      <polygon points="0,24 32,0 132,0 100,24" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
      <polygon points="41,15 51,7 93,7 83,15" fill="#f5ebe6" stroke="#b45309" stroke-width="1.1"/>
      <polygon points="100,24 132,0 132,64 100,88" fill="#6b7280" stroke="#374151" stroke-width="1.4"/>
      <rect x="0" y="24" width="100" height="64" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
      <text x="50" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111827">Kotak Donasi</text>
    </g>
  </g>
</svg>
