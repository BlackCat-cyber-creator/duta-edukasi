<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img">
  <rect width="420" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Sumbu mayor dan minor -->
  <line x1="40" y1="135" x2="380" y2="135" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="210" y1="28" x2="210" y2="238" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <!-- Lintasan elips -->
  <ellipse cx="210" cy="135" rx="145" ry="90" fill="none" stroke="#1D4ED8" stroke-width="2.2"/>
  <!-- Pusat elips O -->
  <circle cx="210" cy="135" r="3" fill="#475569"/>
  <text x="210" y="152" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#475569">O</text>
  <!-- Bintang di fokus F1 -->
  <circle cx="128" cy="135" r="11" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
  <text x="128" y="116" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#B45309">M (F₁)</text>
  <!-- Titik Perihelion P dan Aphelion A -->
  <circle cx="65" cy="135" r="5" fill="#0F172A"/>
  <text x="53" y="128" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">P</text>
  <circle cx="355" cy="135" r="5" fill="#0F172A"/>
  <text x="366" y="128" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">A</text>
  <!-- Planet di lintasan -->
  <circle cx="290" cy="60" r="6.5" fill="#0284C7" stroke="#0F172A" stroke-width="1.2"/>
  <text x="303" y="55" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0284C7">Planet</text>
  <!-- Dimensi r_p (bawah kiri) -->
  <line x1="65" y1="168" x2="128" y2="168" stroke="#9F1239" stroke-width="1.5"/>
  <line x1="65" y1="163" x2="65" y2="173" stroke="#9F1239" stroke-width="1.5"/>
  <line x1="128" y1="163" x2="128" y2="173" stroke="#9F1239" stroke-width="1.5"/>
  <text x="96.5" y="185" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#9F1239">rₚ</text>
  <!-- Dimensi r_a (bawah kanan) -->
  <line x1="128" y1="196" x2="355" y2="196" stroke="#047857" stroke-width="1.5"/>
  <line x1="128" y1="191" x2="128" y2="201" stroke="#047857" stroke-width="1.5"/>
  <line x1="355" y1="191" x2="355" y2="201" stroke="#047857" stroke-width="1.5"/>
  <text x="241.5" y="213" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#047857">rₐ</text>
  <!-- Setengah sumbu panjang a -->
  <line x1="210" y1="112" x2="355" y2="112" stroke="#1E3A8A" stroke-width="1.5"/>
  <line x1="210" y1="107" x2="210" y2="117" stroke="#1E3A8A" stroke-width="1.5"/>
  <line x1="355" y1="107" x2="355" y2="117" stroke="#1E3A8A" stroke-width="1.5"/>
  <text x="282.5" y="104" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">a</text>
  <!-- Label Perihelion & Aphelion -->
  <text x="65" y="244" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Perihelion</text>
  <text x="355" y="244" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Aphelion</text>
</svg>
