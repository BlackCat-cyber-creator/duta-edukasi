<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img">
  <rect width="420" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Bintang latar belakang jauh -->
  <line x1="40" y1="28" x2="380" y2="28" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="210" y="20" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B">Bintang latar belakang jauh</text>
  <!-- Orbit Bumi -->
  <ellipse cx="210" cy="230" rx="110" ry="24" fill="none" stroke="#0284C7" stroke-width="1.8"/>
  <!-- Garis pandang E1 -> B -> latar -->
  <line x1="100" y1="230" x2="210" y2="95" stroke="#1D4ED8" stroke-width="1.6"/>
  <line x1="210" y1="95" x2="265" y2="28" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- Garis pandang E2 -> B -> latar -->
  <line x1="320" y1="230" x2="210" y2="95" stroke="#1D4ED8" stroke-width="1.6"/>
  <line x1="210" y1="95" x2="155" y2="28" stroke="#1D4ED8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- Garis tengah S - B dan baseline E1 - E2 -->
  <line x1="210" y1="230" x2="210" y2="95" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 3"/>
  <line x1="100" y1="230" x2="320" y2="230" stroke="#0F172A" stroke-width="1.6"/>
  <!-- Busur sudut paralaks p dan 2p -->
  <path d="M 210 132 A 37 37 0 0 0 233 123" fill="none" stroke="#9F1239" stroke-width="1.8"/>
  <text x="226" y="144" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#9F1239">p</text>
  <path d="M 188 68 A 35 35 0 0 1 232 68" fill="none" stroke="#047857" stroke-width="1.8"/>
  <text x="210" y="59" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#047857">2p</text>
  <!-- Matahari S -->
  <circle cx="210" cy="230" r="9.5" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
  <text x="210" y="253" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#B45309">S (Matahari)</text>
  <!-- Posisi Bumi E1 & E2 -->
  <circle cx="100" cy="230" r="6" fill="#0284C7" stroke="#0F172A" stroke-width="1.2"/>
  <text x="86" y="234" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">E₁</text>
  <circle cx="320" cy="230" r="6" fill="#0284C7" stroke="#0F172A" stroke-width="1.2"/>
  <text x="334" y="234" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">E₂</text>
  <!-- Bintang dekat B -->
  <circle cx="210" cy="95" r="5.5" fill="#9F1239"/>
  <text x="223" y="99" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#9F1239">B</text>
  <!-- Label jarak dan radius -->
  <text x="200" y="170" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#475569">d</text>
  <text x="155" y="223" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0F172A">1 AU</text>
  <text x="265" y="223" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0F172A">1 AU</text>
</svg>
