<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" role="img">
  <rect width="460" height="250" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- 9 equally spaced horizontal gridlines above baseline y=195 (step 18px: y=195,177,159,141,123,105,87,69,51,33) -->
  <g stroke="#CBD5E1" stroke-width="1">
    <line x1="30" y1="33"  x2="430" y2="33"/>
    <line x1="30" y1="51"  x2="430" y2="51"/>
    <line x1="30" y1="69"  x2="430" y2="69"/>
    <line x1="30" y1="87"  x2="430" y2="87"/>
    <line x1="30" y1="105" x2="430" y2="105"/>
    <line x1="30" y1="123" x2="430" y2="123"/>
    <line x1="30" y1="141" x2="430" y2="141"/>
    <line x1="30" y1="159" x2="430" y2="159"/>
    <line x1="30" y1="177" x2="430" y2="177"/>
  </g>
  <line x1="30" y1="195" x2="430" y2="195" stroke="#475569" stroke-width="1.5"/>
  <!-- Bars: Mon=8(144px), Tue=3(54px), Wed=5(90px), Thu=8(144px), Fri=7(126px), Sat=5(90px), Sun=1(18px) -->
  <g fill="#334155">
    <rect x="48"  y="51"  width="24" height="144"/>
    <rect x="103" y="141" width="24" height="54"/>
    <rect x="158" y="105" width="24" height="90"/>
    <rect x="213" y="51"  width="24" height="144"/>
    <rect x="268" y="69"  width="24" height="126"/>
    <rect x="323" y="105" width="24" height="90"/>
    <rect x="378" y="177" width="24" height="18"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155" text-anchor="middle">
    <text x="60"  y="212">Monday</text>
    <text x="115" y="212">Tuesday</text>
    <text x="170" y="212">Wednesday</text>
    <text x="225" y="212">Thursday</text>
    <text x="280" y="212">Friday</text>
    <text x="335" y="212">Saturday</text>
    <text x="390" y="212">Sunday</text>
    <text x="230" y="234" font-size="13" font-weight="600" fill="#0F172A">Number of books</text>
  </g>
</svg>
