<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250" role="img">
  <rect width="420" height="250" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <defs>
    <!-- Rooster badge -->
    <g id="rooster">
      <circle cx="0" cy="0" r="18" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
      <path d="M-8,6 C-10,-2 -4,-8 3,-7 C6,-7 8,-4 8,0 C8,5 4,9 -2,9 Z" fill="#334155"/>
      <path d="M3,-7 C3,-11 6,-13 8,-10 C9,-12 12,-10 10,-7" fill="#DC2626"/>
      <polygon points="8,-3 13,-1 8,1" fill="#F59E0B"/>
      <text x="0" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#DC2626" text-anchor="middle">Rooster</text>
    </g>
    <!-- Duck badge -->
    <g id="duck">
      <circle cx="0" cy="0" r="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
      <ellipse cx="-2" cy="4" rx="9" ry="6" fill="#0F172A"/>
      <circle cx="5" cy="-5" r="5" fill="#0F172A"/>
      <polygon points="9,-6 15,-4 9,-2" fill="#F59E0B"/>
      <text x="0" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">Duck</text>
    </g>
    <!-- Ram badge -->
    <g id="ram">
      <circle cx="0" cy="0" r="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
      <circle cx="0" cy="2" r="8" fill="#CBD5E1" stroke="#475569" stroke-width="1.2"/>
      <path d="M-6,-4 C-12,-10 -4,-14 0,-8 C4,-14 12,-10 6,-4" fill="none" stroke="#475569" stroke-width="2"/>
      <circle cx="-3" cy="1" r="1.2" fill="#0F172A"/>
      <circle cx="3" cy="1" r="1.2" fill="#0F172A"/>
      <text x="0" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#16A34A" text-anchor="middle">Ram</text>
    </g>
  </defs>
  <!-- Equation 1: Rooster x Rooster + Duck = 100 -->
  <use href="#rooster" x="75" y="38"/>
  <use href="#rooster" x="155" y="38"/>
  <use href="#duck" x="235" y="38"/>
  <!-- Equation 2: Rooster + Duck + Ram = 33 -->
  <use href="#rooster" x="75" y="102"/>
  <use href="#duck" x="155" y="102"/>
  <use href="#ram" x="235" y="102"/>
  <!-- Equation 3: Ram + Rooster = 14 -->
  <use href="#ram" x="75" y="166"/>
  <use href="#rooster" x="155" y="166"/>
  <!-- Question prompt icon -->
  <use href="#rooster" x="125" y="220"/>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">
    <text x="115" y="38">×</text>
    <text x="195" y="38">+</text>
    <text x="295" y="38">= 100</text>
    <text x="115" y="102">+</text>
    <text x="195" y="102">+</text>
    <text x="295" y="102">= 33</text>
    <text x="115" y="166">+</text>
    <text x="215" y="166">= 14</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0F172A" dominant-baseline="central">
    <text x="28" y="220">What does</text>
    <text x="155" y="220">stand for?</text>
  </g>
</svg>
