<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img">
  <rect width="360" height="220" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <g transform="translate(40, 20)" stroke="#0F172A" stroke-width="2">
    <!-- Row 1: 7 squares (y=0) -->
    <rect x="0"   y="0" width="40" height="40" fill="#FFFFFF"/>
    <rect x="40"  y="0" width="40" height="40" fill="#64748B"/>
    <rect x="80"  y="0" width="40" height="40" fill="#FFFFFF"/>
    <rect x="120" y="0" width="40" height="40" fill="#64748B"/>
    <rect x="160" y="0" width="40" height="40" fill="#FFFFFF"/>
    <rect x="200" y="0" width="40" height="40" fill="#64748B"/>
    <rect x="240" y="0" width="40" height="40" fill="#FFFFFF"/>
    <!-- Row 2: 5 squares (y=40, x=40..200) -->
    <rect x="40"  y="40" width="40" height="40" fill="#FFFFFF"/>
    <rect x="80"  y="40" width="40" height="40" fill="#64748B"/>
    <rect x="120" y="40" width="40" height="40" fill="#FFFFFF"/>
    <rect x="160" y="40" width="40" height="40" fill="#64748B"/>
    <rect x="200" y="40" width="40" height="40" fill="#FFFFFF"/>
    <!-- Row 3: 3 squares (y=80, x=80..160) -->
    <rect x="80"  y="80" width="40" height="40" fill="#FFFFFF"/>
    <rect x="120" y="80" width="40" height="40" fill="#64748B"/>
    <rect x="160" y="80" width="40" height="40" fill="#FFFFFF"/>
    <!-- Row 4: 1 square (y=120, x=120) -->
    <rect x="120" y="120" width="40" height="40" fill="#FFFFFF"/>
  </g>
  <g transform="translate(40, 20)" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">
    <text x="20" y="20">2</text>
    <text x="100" y="20">3</text>
    <text x="180" y="20" fill="#1D4ED8">?</text>
    <text x="260" y="20">6</text>
    <text x="60" y="60">5</text>
    <text x="140" y="140">32</text>
  </g>
</svg>
